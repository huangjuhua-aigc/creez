<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=750">
  <title>正文</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    #render-target {
      position: relative;
      width: 750px;
      height: 1000px;
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      background-size: cover;
      background-position: center;
    }
    .overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(4px); }
    .grid { position: absolute; inset: 0; opacity: 0.03; background-image: linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px); background-size: 40px 40px; }
    .blur1 { position: absolute; top: 0; right: 0; width: 256px; height: 256px; background: linear-gradient(135deg, rgba(6,182,212,0.1), rgba(59,130,246,0.1)); filter: blur(24px); }
    .blur2 { position: absolute; bottom: 0; left: 0; width: 192px; height: 192px; background: linear-gradient(225deg, rgba(59,130,246,0.1), rgba(168,85,247,0.1)); filter: blur(24px); }
    .main { position: relative; height: 100%; display: flex; flex-direction: column; padding: 48px; z-index: 10; }
    .top-line { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; }
    .line { height: 2px; width: 48px; background: linear-gradient(90deg, #06b6d4, #2563eb); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #06b6d4; }
    .line2 { height: 2px; flex: 1; background: linear-gradient(90deg, #2563eb, transparent); }
    .content-wrap { flex: 1; position: relative; }
    .bar { position: absolute; left: -24px; top: 0; width: 4px; height: 128px; background: linear-gradient(180deg, #06b6d4, transparent); border-radius: 2px; opacity: 0.7; }
    .content { color: #1e293b; font-size: 24px; line-height: 1.8; font-weight: 500; white-space: pre-wrap; }
    .content h2 { font-size: 36px; font-weight: 700; color: #0f172a; margin: 32px 0 24px 0; letter-spacing: 0.05em; }
    .content .list { display: flex; gap: 16px; margin-bottom: 16px; align-items: flex-start; }
    .content .list-num { color: #0891b2; font-weight: 700; flex-shrink: 0; }
    .content p { margin-bottom: 16px; }
    .content .blank { height: 24px; }
    .bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
    .dots { display: flex; gap: 6px; }
    .dots span { height: 4px; border-radius: 2px; background: #06b6d4; }
    .dots span:nth-child(1) { width: 32px; }
    .dots span:nth-child(2) { width: 16px; background: #38bdf8; }
    .dots span:nth-child(3) { width: 8px; background: #7dd3fc; }
    .badge { padding: 6px 16px; background: linear-gradient(90deg, rgba(6,182,212,0.1), rgba(59,130,246,0.1)); border: 1px solid rgba(6,182,212,0.2); border-radius: 999px; font-size: 14px; color: #475569; font-weight: 600; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="render-target">
    <div class="overlay"></div>
    <div class="grid"></div>
    <div class="blur1"></div>
    <div class="blur2"></div>
    <div class="main">
      <div class="top-line">
        <div class="line"></div>
        <div class="dot"></div>
        <div class="line2"></div>
      </div>
      <div class="content-wrap">
        <div class="bar"></div>
        <div class="content" id="content"></div>
      </div>
      <div class="bottom">
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="badge">CONTENT</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var raw = q.get('content') || '缺少内容';
      var bg = q.get('backgroundImage');
var base = location.href.replace(/\?.*$/, '').replace(/\/[^/]+$/, '/');
  var defaultBg = base + '../template/default-bg.png';
      var target = document.getElementById('render-target');
      target.style.backgroundImage = 'url(' + (bg ? decodeURIComponent(bg) : defaultBg) + ')';
      var lines = decodeURIComponent(raw).split('\n');
      var html = '';
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var t = line.trim();
        if (t.startsWith('#')) {
          html += '<h2>' + t.replace(/^#+/, '').trim() + '</h2>';
        } else if (t === '') {
          html += '<div class="blank"></div>';
        } else if (/^[\d]+\./.test(t)) {
          var num = t.match(/^[\d]+\./)[0];
          var rest = t.replace(/^[\d]+\./, '').trim();
          html += '<div class="list"><span class="list-num">' + num + '</span><span>' + rest + '</span></div>';
        } else {
          html += '<p>' + line + '</p>';
        }
      }
      document.getElementById('content').innerHTML = html;
      window.RENDER_READY = true;
    })();
  </script>
</body>
</html>
